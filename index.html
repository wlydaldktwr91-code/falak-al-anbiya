["الخلق والسجود","خَلَقَ اللهُ آدَمَ مِنْ طِينٍ، وَنَفَخَ فِيهِ مِنْ رُوحِهِ، وَأَمَرَ الْمَلَائِكَةَ بِالسُّجُودِ لَهُ تَكْرِيمًا. فَسَجَدُوا إِلَّا إِبْلِيسَ اسْتَكْبَرَ وَقَالَ إِنَّهُ خَيْرٌ مِنْهُ."],
["علم الأسماء","عَلَّمَ اللهُ آدَمَ الْأَسْمَاءَ كُلَّهَا، ثُمَّ عَرَضَهُمْ عَلَى الْمَلَائِكَةِ. فَقَالُوا: سُبْحَانَكَ لَا عِلْمَ لَنَا إِلَّا مَا عَلَّمْتَنَا، وَظَهَرَ فَضْلُ آدَمَ بِالْعِلْمِ."],
["الجنة والابتلاء","أَسْكَنَ اللهُ آدَمَ وَزَوْجَهُ الْجَنَّةَ، وَنَهَاهُمَا عَنْ شَجَرَةٍ وَاحِدَةٍ. فَوَسْوَسَ لَهُمَا الشَّيْطَانُ حَتَّى أَكَلَا مِنْهَا."],
["الهبوط والتوبة","تَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِمَاتٍ فَتَابَ اللهُ عَلَيْهِ، وَهَبَطَ إِلَى الْأَرْضِ لِيَعْمُرَهَا. وَصَارَتْ قِصَّتُهُ أَوَّلَ دَرْسٍ فِي أَنَّ الذَّنْبَ يُمْحَى بِالتَّوْبَةِ."]]},
{id:"nuh",g:["الصبر","الدعوة"],s:"نوح",t:"قصة نوح عليه السلام",c:"قصص الأنبياء",ref:"القرآن الكريم: هود، نوح",ch:[
["دعوة طويلة","دَعَا نُوحٌ قَوْمَهُ إِلَى عِبَادَةِ اللهِ لَيْلًا وَنَهَارًا، سِرًّا وَجَهْرًا. وَبَقِيَ فِيهِمْ أَلْفَ سَنَةٍ إِلَّا خَمْسِينَ عَامًا، فَلَمْ يُؤْمِنْ مَعَهُ إِلَّا قَلِيلٌ."],
["سخرية القوم","أَصَرَّ الْكُبَرَاءُ عَلَى الْكُفْرِ وَقَالُوا: مَا نَرَاكَ إِلَّا بَشَرًا مِثْلَنَا. وَلَمْ يَتْرُكْ نُوحٌ الدَّعْوَةَ، وَصَبَرَ عَلَى أَذَاهُمْ."],
["بناء السفينة","أَمَرَهُ اللهُ أَنْ يَصْنَعَ الْفُلْكَ، فَكَانَ قَوْمُهُ يَسْخَرُونَ مِنْهُ كُلَّمَا مَرُّوا بِهِ. وَكَانَ يَرُدُّ عَلَيْهِمْ بِثِقَةٍ أَنَّ الْعَاقِبَةَ لِمَنِ اتَّقَى."],
["الطوفان والنجاة","فَارَ التَّنُّورُ وَجَاءَ الطُّوفَانُ، فَحَمَلَ نُوحٌ مَنْ آمَنَ مَعَهُ وَزَوْجَيْنِ مِنْ كُلِّ نَوْعٍ. ثُمَّ اسْتَوَتِ السَّفِينَةُ عَلَى الْجُودِيِّ وَنَجَا الْمُؤْمِنُونَ."]]},
{id:"yusuf",g:["الصبر","العفو"],s:"يوسف",t:"قصة يوسف عليه السلام",c:"قصص الأنبياء",ref:"القرآن الكريم: سورة يوسف",ch:[
["الرؤيا والجب","رَأَى يُوسُفُ فِي مَنَامِهِ أَحَدَ عَشَرَ كَوْكَبًا وَالشَّمْسَ وَالْقَمَرَ سَاجِدِينَ لَهُ. فَحَسَدَهُ إِخْوَتُهُ وَأَلْقَوْهُ فِي الْجُبِّ."],
["في بيت العزيز","الْتَقَطَتْهُ قَافِلَةٌ وَبَاعُوهُ فِي مِصْرَ، فَاشْتَرَاهُ عَزِيزُهَا وَأَكْرَمَ مَثْوَاهُ. وَرَاوَدَتْهُ امْرَأَةُ الْعَزِيزِ فَاسْتَعْصَمَ وَقَالَ: مَعَاذَ اللهِ."],
["السجن والتمكين","دَخَلَ السِّجْنَ ظُلْمًا، وَفَسَّرَ هُنَاكَ رُؤْيَا صَاحِبَيْهِ بِعِلْمٍ عَلَّمَهُ اللهُ. ثُمَّ فَسَّرَ رُؤْيَا الْمَلِكِ فَصَارَ عَلَى خَزَائِنِ الْأَرْضِ."],
["لقاء الإخوة","جَاءَ إِخْوَتُهُ إِلَى مِصْرَ فَعَرَفَهُمْ وَعَفَا عَنْهُمْ، وَاجْتَمَعَ شَمْلُ الْأُسْرَةِ. وَتَحَقَّقَتِ الرُّؤْيَا الْقَدِيمَةُ."]]},
{id:"hijra",g:["الهجرة","السيرة"],s:"الهجرة",t:"هجرة النبي ﷺ",c:"السيرة النبوية",ref:"السيرة النبوية لابن هشام، وصحيح البخاري",ch:[
["ليلة الخروج","اشْتَدَّ أَذَى قُرَيْشٍ، فَأَذِنَ اللهُ لِنَبِيِّهِ بِالْهِجْرَةِ إِلَى الْمَدِينَةِ. وَخَرَجَ ﷺ لَيْلًا مِنْ بَيْتِهِ وَقَدْ أَخَذَ الْمُشْرِكُونَ يَتَرَصَّدُونَهُ."],
["في غار ثور","مَكَثَ ﷺ وَأَبُو بَكْرٍ ثَلَاثَ لَيَالٍ فِي الْغَارِ، وَكَانَ عَبْدُ اللهِ بْنُ أَبِي بَكْرٍ يَأْتِيهِمَا بِأَخْبَارِ مَكَّةَ. وَجَاءَ الطَّلَبُ إِلَى بَابِ الْغَارِ فَحَفِظَهُمَا اللهُ."],
["الطريق إلى المدينة","سَارَا بِدَلِيلٍ مَاهِرٍ فِي طُرُقٍ غَيْرِ مَأْلُوفَةٍ، وَنَزَلَا فِي قُبَاءَ أَيَّامًا. وَأَسَّسَ ﷺ هُنَاكَ أَوَّلَ مَسْجِدٍ فِي الْإِسْلَامِ."],
["الوصول إلى المدينة","اسْتَقْبَلَ أَهْلُ الْمَدِينَةِ النَّبِيَّ ﷺ بِفَرَحٍ عَظِيمٍ. فَبَنَى الْمَسْجِدَ وَآخَى بَيْنَ الْمُهَاجِرِينَ وَالْأَنْصَارِ، وَبَدَأَ بِنَاءُ الْمُجْتَمَعِ الْجَدِيدِ."]]},
{id:"abubakr",g:["الصدق","الخلافة"],s:"أبو بكر",t:"أبو بكر الصديق رضي الله عنه",c:"الصحابة",ref:"سير أعلام النبلاء للذهبي، وصحيح البخاري",ch:[
["السبق إلى الإسلام","كَانَ أَبُو بَكْرٍ أَوَّلَ الرِّجَالِ إِسْلَامًا، وَصَدَّقَ النَّبِيَّ ﷺ فِي خَبَرِ الْإِسْرَاءِ فَلُقِّبَ بِالصِّدِّيقِ. وَأَنْفَقَ مَالَهُ فِي تَحْرِيرِ الْمُسْتَضْعَفِينَ."],
["رفيق الهجرة","صَحِبَ النَّبِيَّ ﷺ فِي الْغَارِ وَفِي الطَّرِيقِ، وَجَعَلَ نَفْسَهُ فِدَاءً لَهُ. وَنَزَلَ فِيهِ قَوْلُ اللهِ: ثَانِيَ اثْنَيْنِ إِذْ هُمَا فِي الْغَارِ."],
["يوم وفاة النبي","ثَبَّتَ النَّاسَ يَوْمَ وَفَاةِ النَّبِيِّ ﷺ وَقَالَ إِنَّ اللهَ حَيٌّ لَا يَمُوتُ. ثُمَّ بَايَعَهُ الْمُسْلِمُونَ خَلِيفَةً."],
["خلافة قصيرة عظيمة","حَفِظَ وَحْدَةَ الْأُمَّةِ وَقَاتَلَ الْمُرْتَدِّينَ، وَجَمَعَ الْقُرْآنَ فِي صُحُفٍ بَعْدَ مَعْرَكَةِ الْيَمَامَةِ. وَكَانَتْ خِلَافَتُهُ نَحْوَ سَنَتَيْنِ وَثَلَاثَةِ أَشْهُرٍ."]]},
{id:"umar",g:["العدل","الفتوحات"],s:"عمر",t:"عمر بن الخطاب رضي الله عنه",c:"الصحابة",ref:"سير أعلام النبلاء للذهبي، وفضائل الصحابة",ch:[
["إسلام الفاروق","أَسْلَمَ عُمَرُ بَعْدَ أَنْ كَانَ شَدِيدًا عَلَى الْمُسْلِمِينَ، فَكَانَ إِسْلَامُهُ عِزًّا لَهُمْ. وَسُمِّيَ الْفَارُوقَ لِأَنَّهُ فَرَّقَ بَيْنَ الْحَقِّ وَالْبَاطِلِ."],
["العدل والمحاسبة","اشْتُهِرَ فِي خِلَافَتِهِ بِالْعَدْلِ وَتَفَقُّدِ الرَّعِيَّةِ لَيْلًا. وَكَانَ يُحَاسِبُ وُلَاتَهُ عَلَى أَمْوَالِهِمْ وَيَنْصُرُ الْمَظْلُومَ."],
["تنظيم الدولة","أَنْشَأَ الدَّوَاوِينَ وَفَرَضَ الْعَطَاءَ، وَوَضَعَ التَّقْوِيمَ الْهِجْرِيَّ."],
["اتساع الدولة","فِي عَهْدِهِ فُتِحَتِ الشَّامُ وَالْعِرَاقُ وَمِصْرُ وَبِلَادُ فَارِسَ. وَبَقِيَ مَعَ اتِّسَاعِ الدَّوْلَةِ زَاهِدًا فِي عَيْشِهِ حَتَّى اسْتُشْهِدَ فِي الْمِحْرَابِ."]]},
{id:"ibrahim",s:"إبراهيم",t:"قصة إبراهيم عليه السلام",g:["التوحيد","الثقة"],c:"قصص الأنبياء",ref:"القرآن الكريم: الأنعام، الأنبياء، البقرة",ch:[
["البحث عن الحق","رَأَى إِبْرَاهِيمُ الْكَوْكَبَ ثُمَّ الْقَمَرَ ثُمَّ الشَّمْسَ، فَلَمَّا غَابَتْ قَالَ: لَا أُحِبُّ الْآفِلِينَ. وَاهْتَدَى إِلَى أَنَّ الرَّبَّ هُوَ الَّذِي خَلَقَ السَّمَوَاتِ وَالْأَرْضَ."],
["تحطيم الأصنام","دَعَا أَبَاهُ وَقَوْمَهُ إِلَى تَرْكِ الْأَصْنَامِ، فَلَمَّا ذَهَبُوا إِلَى عِيدِهِمْ كَسَرَهَا إِلَّا كَبِيرَهَا. وَأَرَادَ أَنْ يُرِيَهُمْ أَنَّ مَا لَا يَنْطِقُ لَا يَنْفَعُ وَلَا يَضُرُّ."],
["النار بردا وسلاما","أَلْقَوْهُ فِي النَّارِ فَقَالَ اللهُ: يَا نَارُ كُونِي بَرْدًا وَسَلَامًا عَلَى إِبْرَاهِيمَ. فَنَجَّاهُ اللهُ، وَصَارَ مَثَلًا فِي الثِّقَةِ بِاللهِ."],
["بناء الكعبة","رَفَعَ إِبْرَاهِيمُ وَإِسْمَاعِيلُ قَوَاعِدَ الْبَيْتِ، وَهُمَا يَدْعُوَانِ: رَبَّنَا تَقَبَّلْ مِنَّا. وَأُمِرَ أَنْ يُؤَذِّنَ فِي النَّاسِ بِالْحَجِّ."]]},
{id:"musa",s:"موسى",t:"قصة موسى عليه السلام",g:["الصبر","النجاة"],c:"قصص الأنبياء",ref:"القرآن الكريم: القصص، طه، الشعراء",ch:[
["الصندوق على النيل","أَلْهَمَ اللهُ أُمَّ مُوسَى أَنْ تُلْقِيَهُ فِي الْيَمِّ خَوْفًا مِنْ فِرْعَوْنَ. فَالْتَقَطَهُ آلُ فِرْعَوْنَ، وَرَدَّهُ اللهُ إِلَى أُمِّهِ لِتَقَرَّ عَيْنُهَا."],
["مدين","خَرَجَ مُوسَى مِنْ مِصْرَ خَائِفًا، فَسَقَى لِامْرَأَتَيْنِ عِنْدَ مَاءِ مَدْيَنَ. وَأَقَامَ هُنَاكَ سِنِينَ عِنْدَ رَجُلٍ صَالِحٍ."],
["النداء في الوادي","رَأَى نَارًا عِنْدَ الطُّورِ فَذَهَبَ إِلَيْهَا، فَنُودِيَ: إِنِّي أَنَا اللهُ رَبُّ الْعَالَمِينَ. وَكَلَّفَهُ بِالذَّهَابِ إِلَى فِرْعَوْنَ، وَأَيَّدَهُ بِأَخِيهِ هَارُونَ."],
["انفلاق البحر","خَرَجَ مُوسَى بِبَنِي إِسْرَائِيلَ لَيْلًا، وَلَحِقَ بِهِمْ فِرْعَوْنُ. فَأَمَرَهُ اللهُ أَنْ يَضْرِبَ الْبَحْرَ بِعَصَاهُ فَانْفَلَقَ، وَنَجَا الْمُؤْمِنُونَ وَغَرِقَ الْمُفْسِدُونَ."]]},
{id:"uthman",s:"عثمان",t:"عثمان بن عفان رضي الله عنه",g:["الكرم","القرآن"],c:"الصحابة",ref:"سير أعلام النبلاء للذهبي، وصحيح البخاري",ch:[
["الحياء والسبق","كَانَ عُثْمَانُ مِنَ السَّابِقِينَ إِلَى الْإِسْلَامِ، وَاشْتُهِرَ بِالْحَيَاءِ وَالْكَرَمِ. وَتَزَوَّجَ ابْنَتَيِ النَّبِيِّ ﷺ رُقَيَّةَ ثُمَّ أُمَّ كُلْثُومٍ، فَلُقِّبَ بِذِي النُّورَيْنِ."],
["بئر رومة","اشْتَرَى عُثْمَانُ بِئْرَ رُومَةَ وَجَعَلَهَا سَبِيلًا لِلْمُسْلِمِينَ، وَجَهَّزَ جَيْشَ الْعُسْرَةِ بِمَالِهِ. فَكَانَ مِثَالًا فِي الْإِنْفَاقِ."],
["جمع المصحف","فِي خِلَافَتِهِ أَمَرَ بِنَسْخِ الْمُصْحَفِ عَلَى حَرْفٍ وَاحِدٍ وَإِرْسَالِهِ إِلَى الْأَمْصَارِ، لِيَجْتَمِعَ النَّاسُ عَلَى قِرَاءَةٍ مُوَحَّدَةٍ. وَعُرِفَ ذَلِكَ بِالْمُصْحَفِ الْعُثْمَانِيِّ."]]}
];

async function fetchJSON(url, timeout=16000){
 const controller=new AbortController(); const t=setTimeout(()=>controller.abort(),timeout);
 try{ const res=await fetch(url,{signal:controller.signal,headers:{Accept:'application/json'}}); if(!res.ok) throw new Error(`HTTP ${res.status}`); const json=await res.json(); if(json.code && json.code!==200) throw new Error(json.status||'API error'); if(json.data===undefined) throw new Error('صيغة بيانات غير متوقعة'); return json.data; }
 finally{clearTimeout(t);}
}

// IndexedDB: تخزين السور التي يختار المستخدم تنزيلها لتكون متاحة دون اتصال.
let dbPromise;
function openDB(){ if(dbPromise) return dbPromise; dbPromise=new Promise((resolve,reject)=>{ if(!('indexedDB' in window)) return reject(new Error('IndexedDB غير متاح')); const req=indexedDB.open('falak-anbiya-db',1); req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains('surahs')) db.createObjectStore('surahs'); if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta'); }; req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); }); return dbPromise; }
async function dbGet(store,key){ const db=await openDB(); return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);}); }
async function dbSet(store,key,value){ const db=await openDB(); return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(value,key);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);}); }
async function getSurahData(id, edition=appState.edition){
 const key=`${id}_${edition}`;
 try{ const data=await fetchJSON(`${API_Q}/surah/${id}/editions/quran-uthmani,${edition}`); await dbSet('surahs',key,data).catch(()=>{}); return {data,offline:false}; }
 catch(err){ const cached=await dbGet('surahs',key).catch(()=>null); if(cached) return {data:cached,offline:true}; throw err; }
}

}
function aladhanDate(){const d=new Date();return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;}
function renderPrayer(data,place){const t=data.timings||{};const h=data.date?.hijri;const labels=[['Fajr','الفجر'],['Sunrise','الشروق'],['Dhuhr','الظهر'],['Asr','العصر'],['Maghrib','المغرب'],['Isha','العشاء']];const now=new Date();const minutes=now.getHours()*60+now.getMinutes();let next=null;for(const [key,name] of labels.filter(x=>x[0]!=='Sunrise')){const m=String(t[key]||'').match(/^(\d{1,2}):(\d{2})/);if(m&&Number(m[1])*60+Number(m[2])>minutes){next=key;break;}}
 $('#prayerResult').innerHTML=`<div class="panel"><div class="source-line"><strong>${escapeHTML(place)}</strong><span>${escapeHTML(data.date?.readable||'')}</span></div><h2 style="font:600 1.5rem 'Reem Kufi';margin:8px 0">${h?`${escapeHTML(h.day)} ${escapeHTML(h.month?.ar||'')} ${escapeHTML(h.year)} هـ`:''}</h2><div class="prayer-grid">${labels.map(([key,name])=>`<div class="prayer-item ${key===next?'next':''}"><strong>${name}</strong><span dir="ltr">${escapeHTML(String(t[key]||'—').split(' ')[0])}</span>${key===next?'<small class="muted">القادمة</small>':''}</div>`).join('')}</div><p class="tiny muted" style="margin-top:14px">طريقة الحساب: ${escapeHTML(data.meta?.method?.name||'AlAdhan')} · المنطقة الزمنية: ${escapeHTML(data.meta?.timezone||'')}</p><p class="tiny muted">قد تختلف المواقيت عن تقويم المسجد المحلي. اتبع الجهة الدينية المعتمدة في منطقتك عند الحاجة إلى ضبط أدق.</p></div>`;
 $('#prayerStatus').innerHTML='<i class="dot"></i> تم التحديث';
}
async function loadPrayerByCity(){const raw=$('#cityInput')?.value.trim()||appState.city;if(!raw){toast('اكتب المدينة والدولة أولاً.');return;}const parts=raw.split(',');const city=parts[0].trim(),country=(parts.slice(1).join(',').trim()||'');if(!country){toast('اكتب الدولة بعد فاصلة، مثال: Frankfurt, Germany');return;}appState.city=raw;saveSettings();$('#prayerResult').innerHTML=showLoading('جارٍ جلب المواقيت');try{const data=await fetchJSON(`${API_P}/timingsByCity/${aladhanDate()}?city=${enc(city)}&country=${enc(country)}&method=${appState.method}`);appState.prayerData=data;renderPrayer(data,raw);$('#qiblaPanel').innerHTML='<div class="empty">لحساب اتجاه القبلة بدقة، استخدم موقعك أو أدخل الإحداثيات في المتصفح.</div>';}catch(e){$('#prayerResult').innerHTML='<div class="empty">تعذر جلب المواقيت. تحقق من كتابة المدينة والدولة والاتصال بالإنترنت.</div>';$('#prayerStatus').innerHTML='<i class="dot off"></i> فشل التحديث';}}
function loadPrayerByLocation(){if(!navigator.geolocation)return toast('تحديد الموقع غير مدعوم في جهازك.');$('#prayerResult').innerHTML=showLoading('بانتظار إذن الموقع…');navigator.geolocation.getCurrentPosition(async pos=>{const {latitude:lat,longitude:lon}=pos.coords;try{const data=await fetchJSON(`${API_P}/timings/${aladhanDate()}?latitude=${lat}&longitude=${lon}&method=${appState.method}`);appState.prayerData=data;renderPrayer(data,`إحداثيات جهازك · ${lat.toFixed(2)}, ${lon.toFixed(2)}`);renderQibla(lat,lon);}catch(e){$('#prayerResult').innerHTML='<div class="empty">تعذر حساب المواقيت من الموقع الحالي.</div>'; }},err=>{$('#prayerResult').innerHTML='<div class="empty">لم يتم منح إذن الموقع أو تعذر تحديده. يمكنك إدخال المدينة يدوياً.</div>';},{enableHighAccuracy:false,timeout:12000,maximumAge:300000});}
function renderQibla(lat,lon){const kaabaLat=21.422487,kaabaLon=39.826206;const toRad=d=>d*Math.PI/180;const y=Math.sin(toRad(kaabaLon-lon));const x=Math.cos(toRad(lat))*Math.tan(toRad(kaabaLat))-Math.sin(toRad(lat))*Math.cos(toRad(kaabaLon-lon));const bearing=(Math.atan2(y,x)*180/Math.PI+360)%360;$('#qiblaPanel').innerHTML=`<div style="text-align:center"><div class="qibla-arrow"><span style="transform:rotate(${bearing}deg)">↑</span></div><strong style="font:600 1.5rem 'Reem Kufi'">${bearing.toFixed(1)}°</strong><p class="muted tiny">من الشمال باتجاه عقارب الساعة · اتجاه تقريبي محسوب من موقعك</p><button class="btn" onclick="loadPrayerByLocation()">تحديث موقعي</button></div>`;}

function tasbeehPage(){const p=appState.tasbeeh||0,target=Number(appState.target)||33;$('#app').innerHTML=`<div class="section-head"><div><h1 class="page-title">المسبحة الإلكترونية</h1><p>عداد بسيط يحتفظ بعددك على هذا الجهاز.</p></div></div><div class="panel" style="text-align:center"><div class="toolbar" style="max-width:320px;margin:auto"><label class="tiny muted" for="targetSelect">الهدف</label><select id="targetSelect" class="select" onchange="setTarget(this.value)"><option value="33">٣٣</option><option value="100">١٠٠</option><option value="200">٢٠٠</option><option value="500">٥٠٠</option></select></div><div class="counter-ring"><div class="counter" id="tasCount">${p}</div><small id="tasTarget">من ${target}</small></div><div class="progress" style="max-width:360px;margin:12px auto"><i id="tasProgress" style="width:${Math.min(100,p/target*100)}%"></i></div><div class="toolbar" style="justify-content:center;margin-top:18px"><button class="btn primary" style="min-width:150px" onclick="incrementTasbeeh()">＋ تسبيحة</button><button class="btn" onclick="resetTasbeeh()">إعادة التصفير</button></div><p class="tiny muted">يمكنك استخدام لوحة المفاتيح بمفتاح المسافة لزيادة العداد عند فتح هذه الصفحة.</p></div>${footer()}`;$('#targetSelect').value=String(target);}
function setTarget(v){appState.target=Number(v);setStore('falak_target',appState.target);tasbeehPage();}
function incrementTasbeeh(){appState.tasbeeh++;setStore('falak_tasbeeh',appState.tasbeeh);const target=Number(appState.target)||33;$('#tasCount').textContent=appState.tasbeeh;$('#tasTarget').textContent=`من ${target}`;$('#tasProgress').style.width=`${Math.min(100,appState.tasbeeh/target*100)}%`;if(appState.tasbeeh===target)toast('أكملت الهدف الذي حددته.');}
function resetTasbeeh(){appState.tasbeeh=0;setStore('falak_tasbeeh',0);tasbeehPage();}

function bookmarksPage(){const verses=appState.ayahMarks,storyMarks=appState.storyMarks;$('#app').innerHTML=`<div class="section-head"><div><h1 class="page-title">علاماتي المرجعية</h1><p>كل ما حفظته من الآيات والفصول على جهازك.</p></div><button class="btn" onclick="exportData()">تصدير النسخة الاحتياطية</button></div><div class="grid two"><div class="panel"><h2 class="page-title">آيات محفوظة</h2>${verses.length?verses.map(v=>`<div class="note"><strong>سورة ${v.s} · آية ${v.a}</strong><div style="font:1.35rem/2 'Amiri Quran'">${escapeHTML(v.text)}</div><button class="mini-btn" onclick="go('surah:${v.s}')">فتح السورة</button></div>`).join(''):'<div class="empty">لم تحفظ آيات بعد.</div>'}</div><div class="panel"><h2 class="page-title">فصول محفوظة</h2>${storyMarks.length?storyMarks.map(k=>{const [id,i]=k.split(':');const b=B.find(x=>x.id===id);return b?`<button class="list-links" style="width:100%;text-align:right;margin:8px 0;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text)" onclick="go('story:${id}')">${escapeHTML(b.t)} – ${escapeHTML(b.ch[Number(i)]?.[0]||'')}</button>`:''}).join(''):'<div class="empty">لم تحفظ فصولاً بعد.</div>'}</div></div>${footer()}`;}

function sourcesPage(){
 $('#app').innerHTML=`<div class="section-head"><div><h1 class="page-title">المصادر والشفافية</h1><p>مصادر البيانات الحية والمراجع التي يُنصح بالرجوع إليها.</p></div></div><div class="panel"><h2 class="page-title">البيانات الحية داخل الموقع</h2><div class="list-links" style="margin-top:12px"><a href="https://alquran.cloud/api" target="_blank" rel="noopener"><span><strong>AlQuran Cloud API</strong><br><small class="muted">نص القرآن بالرسم العثماني، فهرس السور، الترجمات، وبيانات التلاوة.</small></span><span>الوثائق ↗</span></a><a href="https://alquran.cloud/cdn" target="_blank" rel="noopener"><span><strong>AlQuran Cloud CDN</strong><br><small class="muted">ملفات الصوت المستخدمة في تلاوة الآيات.</small></span><span>التوثيق ↗</span></a><a href="https://aladhan.com/prayer-times-api" target="_blank" rel="noopener"><span><strong>AlAdhan API</strong><br><small class="muted">مواقيت الصلاة، طرق الحساب، والتاريخ الهجري.</small></span><span>الوثائق ↗</span></a></div></div><div class="panel" style="margin-top:14px"><h2 class="page-title">مراجع إسلامية للمراجعة</h2><div class="list-links" style="margin-top:12px"><a href="https://quran.com/" target="_blank" rel="noopener"><span><strong>Quran.com</strong><br><small class="muted">قراءة القرآن والاستماع إليه والرجوع إلى ترجمات وتفاسير.</small></span><span>فتح ↗</span></a><a href="https://hadeethenc.com/ar/home" target="_blank" rel="noopener"><span><strong>موسوعة الأحاديث النبوية</strong><br><small class="muted">أحاديث مشروحة بلغات متعددة، مع إمكانية تنزيل مجموعات البيانات وفق شروطها.</small></span><span>فتح ↗</span></a><a href="https://dorar.net/hadith" target="_blank" rel="noopener"><span><strong>موسوعة الدرر السنية</strong><br><small class="muted">البحث في تخريج الأحاديث وأحكام المحدثين.</small></span><span>فتح ↗</span></a><a href="https://shamela.ws/" target="_blank" rel="noopener"><span><strong>المكتبة الشاملة</strong><br><small class="muted">كتب السيرة والتراجم والتراث.</small></span><span>فتح ↗</span></a></div></div><div class="note"><strong>منهجية المحتوى:</strong> نصوص القرآن في قارئ المصحف تأتي من واجهة API المشار إليها. مواقيت الصلاة والتاريخ الهجري تقديرات خدمية وفق طريقة الحساب المختارة. قصص الأنبياء والصحابة الموجودة في المكتبة ملخصات تحريرية محفوظة في الملف الأصلي، وليست استيراداً آلياً من كتب الحديث. لا تُعرض تقييمات المستخدم أو عدد مرات القراءة على أنها إحصاءات عالمية.</div>${footer()}`;
}

function settingsPage(){$('#app').innerHTML=`<div class="section-head"><div><h1 class="page-title">الإعدادات والنسخ الاحتياطي</h1><p>خيارات القراءة والخصوصية والبيانات المحفوظة على جهازك.</p></div></div><div class="panel"><div class="setting-row"><div><strong>مظهر الموقع</strong><small>اختر النمط الذي تفضله.</small></div><select id="themeSelect" class="select" onchange="changeTheme(this.value)"><option value="dark">ليلي</option><option value="light">فاتح</option><option value="gold">ذهبي</option></select></div><div class="setting-row"><div><strong>حجم خط القصص</strong><small>الحجم الحالي: ${appState.font}px</small></div><input class="input" type="range" min="18" max="44" step="1" value="${appState.font}" oninput="appState.font=Number(this.value);setStore('falak_font',appState.font);this.previousElementSibling.querySelector('small').textContent='الحجم الحالي: '+this.value+'px'"></div><div class="setting-row"><div><strong>مدينة مواقيت الصلاة</strong><small>المدينة والدولة مفصولتان بفاصلة.</small></div><input class="input" id="settingsCity" value="${escapeHTML(appState.city)}" placeholder="Frankfurt, Germany"></div><div class="setting-row"><div><strong>طريقة الحساب</strong><small>قد تختلف عن طريقة المسجد المحلي.</small></div><select id="settingsMethod" class="select"><option value="3">رابطة العالم الإسلامي</option><option value="2">ISNA</option><option value="5">مصر</option><option value="4">أم القرى</option><option value="13">ديانت – تركيا</option><option value="12">فرنسا</option></select></div><div class="toolbar" style="margin-top:16px"><button class="btn primary" onclick="saveSettingsPage()">حفظ الإعدادات</button><button class="btn" onclick="exportData()">تصدير بياناتي</button><label class="btn" for="importFile">استيراد نسخة</label><input id="importFile" type="file" accept="application/json" class="hide" onchange="importData(this.files[0])"></div></div><div class="note">تُحفظ المفضلة والعلامات وسجل القصص على هذا الجهاز فقط باستخدام تخزين المتصفح. لا يوجد حساب مستخدم أو مزامنة سحابية في هذه النسخة. لا ترسل بياناتك إلى أي خدمة لتصدير النسخة الاحتياطية.</div><div class="panel"><h2 class="page-title">إدارة البيانات</h2><button class="btn" onclick="clearLocalData()">مسح بيانات القراءة المحلية</button></div>${footer()}`;$('#themeSelect').value=appState.theme;$('#settingsMethod').value=String(appState.method);}
function changeTheme(v){appState.theme=v;document.documentElement.dataset.theme=v;saveSettings();}
function saveSettingsPage(){appState.city=$('#settingsCity').value.trim();appState.method=Number($('#settingsMethod').value);saveSettings();toast('تم حفظ الإعدادات');}
function exportData(){const data={app:'فلك الأنبياء',version:2,exportedAt:new Date().toISOString(),favorites:appState.favorites,storyMarks:appState.storyMarks,ayahMarks:appState.ayahMarks,lastStory:appState.lastStory,tasbeeh:appState.tasbeeh,target:appState.target,settings:{theme:appState.theme,city:appState.city,method:appState.method,edition:appState.edition,font:appState.font}};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='falak-backup.json';a.click();URL.revokeObjectURL(a.href);toast('تم إنشاء نسخة احتياطية.');}
async function importData(file){if(!file)return;try{const d=JSON.parse(await file.text());appState.favorites=Array.isArray(d.favorites)?d.favorites:[];appState.storyMarks=Array.isArray(d.storyMarks)?d.storyMarks:[];appState.ayahMarks=Array.isArray(d.ayahMarks)?d.ayahMarks:[];appState.lastStory=d.lastStory||{};appState.tasbeeh=Number(d.tasbeeh)||0;appState.target=Number(d.target)||33;Object.assign(appState,d.settings||{});setStore('f',appState.favorites);setStore('bm',appState.storyMarks);setStore('falak_ayah_marks',appState.ayahMarks);setStore('h',appState.lastStory);setStore('falak_tasbeeh',appState.tasbeeh);setStore('falak_target',appState.target);saveSettings();toast('تم استيراد بياناتك.');settingsPage();}catch(e){toast('ملف النسخة الاحتياطية غير صالح.');}}
function clearLocalData(){if(!confirm('هل تريد مسح المفضلة والعلامات والسجل والعداد المحفوظ على هذا الجهاز؟'))return;['h','f','bm','falak_ayah_marks','falak_tasbeeh','falak_read_minutes'].forEach(k=>localStorage.removeItem(k));appState.favorites=[];appState.storyMarks=[];appState.ayahMarks=[];appState.lastStory={};appState.tasbeeh=0;toast('تم مسح بيانات القراءة.');settingsPage();}

async function copyText(text){try{await navigator.clipboard.writeText(String(text));toast('تم النسخ.');}catch{toast('تعذر النسخ التلقائي في هذا المتصفح.');}}
function searchModal(open=true){$('#searchModal').classList.toggle('open',open);if(open){$('#globalSearch').value='';$('#globalSearch').focus();searchResults();}}
function searchResults(){const q=cleanArabic($('#globalSearch').value.trim());const storiesFound=B.filter(b=>!q||cleanArabic([b.t,b.s,b.c,...b.g,...b.ch.flat()].join(' ')).includes(q)).slice(0,8);$('#searchResults').innerHTML=storiesFound.map(b=>`<button onclick="searchModal(false);go('story:${b.id}')">${escapeHTML(b.t)} <small class="muted">· ${escapeHTML(b.c)}</small></button>`).join('');if(q)$('#searchResults').innerHTML+=`<button onclick="searchModal(false);quranSearch(${jsArg(q)})">ابحث عن «${escapeHTML(q)}» في القرآن الكريم ←</button>`;}
async function quranSearch(q){if(!q)return;go('quran');setTimeout(async()=>{const app=$('#app');app.innerHTML=`<div class="section-head"><div><h1 class="page-title">نتائج البحث القرآني</h1><p>البحث في النص العربي من AlQuran Cloud عن: ${escapeHTML(q)}</p></div><button class="btn" onclick="go('quran')">رجوع</button></div><div id="qSearchResults">${showLoading('جارٍ البحث')}</div>${footer()}`;try{const data=await fetchJSON(`${API_Q}/search/${enc(q)}/all/quran-uthmani`);const matches=data.matches||[];$('#qSearchResults').innerHTML=matches.length?matches.map(m=>`<div class="verse-card"><div class="verse-top"><span>${escapeHTML(m.surah.name)} · الآية ${m.numberInSurah}</span><button class="mini-btn" onclick="go('surah:${m.surah.number}')">فتح السورة</button></div><div class="verse-text">${escapeHTML(m.text)}</div></div>`).join(''):'<div class="empty">لم يتم العثور على نتيجة.</div>';}catch(e){$('#qSearchResults').innerHTML='<div class="empty">تعذر تنفيذ البحث. جرّب كلمة أخرى أو أعد المحاولة لاحقاً.</div>'; }},50);}
function installApp(){if(installPrompt){installPrompt.prompt();installPrompt.userChoice.finally(()=>{installPrompt=null;$('#installBtn')?.classList.add('hide');});}else toast('استخدم قائمة المتصفح ثم «إضافة إلى الشاشة الرئيسية» بعد نشر الموقع على HTTPS.');}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;const b=$('#installBtn');if(b)b.style.display='inline-flex';});
window.addEventListener('appinstalled',()=>toast('تم تثبيت فلك الأنبياء على جهازك.'));
if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.info('PWA service worker unavailable',e)));}

// Top-level shortcuts and startup.
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal(true);}else if(e.key==='Escape')searchModal(false);else if(e.code==='Space'&&location.hash==='#tasbeeh'&&!/INPUT|SELECT/.test(document.activeElement.tagName)){e.preventDefault();incrementTasbeeh();}});
$('#globalSearch').addEventListener('input',searchResults);
$('#searchModal').addEventListener('click',e=>{if(e.target.id==='searchModal')searchModal(false);});
$('#app').addEventListener('click',()=>{});
route();

</script>
</body></html>
